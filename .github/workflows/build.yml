name: Build

# Builds the sandbox simulation on all three desktop platforms and uploads a
# ready-to-run package for each. The macOS job is the only way to produce the
# .dmg -- macOS binaries and hdiutil both require a real Mac.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # GLEW's prebuilt libs are excluded from the repo by the .gitignore
      # 'x64/' rule, so fetch the official 2.1.0 release here.
      - name: Fetch GLEW binaries
        shell: pwsh
        run: |
          $url = "https://github.com/nigels-com/glew/releases/download/glew-2.1.0/glew-2.1.0-win32.zip"
          Invoke-WebRequest -Uri $url -OutFile glew.zip -UseBasicParsing
          Expand-Archive glew.zip -DestinationPath glew-tmp -Force
          Copy-Item glew-tmp/glew-2.1.0/lib OpenGL/Dependices/glew-2.1.0/ -Recurse -Force
          Copy-Item glew-tmp/glew-2.1.0/bin OpenGL/Dependices/glew-2.1.0/ -Recurse -Force

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/Release/OpenGL.exe stage/
          Compress-Archive -Path stage/* -DestinationPath OpenGL-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGL-windows-x64
          path: OpenGL-windows-x64.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libglfw3-dev libglew-dev libgl1-mesa-dev \
            xorg-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package
        run: |
          mkdir -p stage
          cp build/OpenGL stage/
          tar -czf OpenGL-linux-x64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGL-linux-x64
          path: OpenGL-linux-x64.tar.gz

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install glfw glew

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Create .dmg
        run: |
          mkdir -p dmg-stage
          cp -R build/OpenGL.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "OpenGL" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            OpenGL-macos.dmg
          hdiutil imageinfo OpenGL-macos.dmg | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGL-macos-dmg
          path: OpenGL-macos.dmg
